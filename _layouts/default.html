<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} | Karen Fernandes</title>
<style>
:root{--paper:#f5f7f6;--card:#fff;--ink:#14262b;--muted:#4d6166;--rule:#c9d4d1;--teal:#1f6f6b;--chip:#e4eeec}
@media (prefers-color-scheme:dark){:root{--paper:#10191b;--card:#172326;--ink:#e8f0ee;--muted:#9fb2b5;--rule:#2b3d41;--teal:#5fbdb5;--chip:#1f3236}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:40px 22px 72px}
.back{display:inline-block;margin-bottom:28px;color:var(--teal);font-weight:600}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;line-height:1.2}
h1{font-size:2.2rem}
a{color:var(--teal)}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:18px 0}
th,td{border:1px solid var(--rule);padding:8px 12px;text-align:left;vertical-align:top}
th{background:var(--chip)}
pre,code{background:var(--chip);border-radius:6px}
code{padding:2px 6px}
pre{padding:14px;overflow-x:auto}
pre code{padding:0}
blockquote{margin:18px 0;padding:10px 16px;border-left:4px solid var(--teal);background:var(--chip)}
img{max-width:100%;height:auto}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:20px;border-top:1px solid var(--rule)}
.pager a{padding:8px 18px;border:1px solid var(--rule);border-radius:8px;text-decoration:none;font-weight:600}
.pager .next{margin-left:auto;background:var(--teal);border-color:var(--teal);color:var(--card)}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="{{ '/' | relative_url }}">Back to portfolio</a>
{% if page.prev or page.next %}
<nav class="pager top">
{% if page.prev %}<a href="{{ page.prev }}">← Previous</a>{% endif %}
{% if page.next %}<a class="next" href="{{ page.next }}">Next →</a>{% endif %}
</nav>
{% endif %}
{{ content }}
{% if page.prev or page.next %}
<nav class="pager">
{% if page.prev %}<a href="{{ page.prev }}">← Previous</a>{% endif %}
{% if page.next %}<a class="next" href="{{ page.next }}">Next →</a>{% endif %}
</nav>
{% endif %}
</main>
</body>
</html>
